<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181c2b" />
      <stop offset="60%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff334b" stop-opacity="1" />
      <stop offset="45%" stop-color="#ff1744" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#d50000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757" />
      <stop offset="50%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff8595" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="14 10 30 8 60 12" opacity="0.65" />

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)" />

  <!-- Geometric Hex / Reactor Ring -->
  <circle cx="256" cy="256" r="120" fill="#0b0d13" stroke="url(#ringGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="256" cy="256" r="96" fill="none" stroke="#ff1744" stroke-width="2" stroke-dasharray="4 8" opacity="0.8" />

  <!-- Stylized "U" Reactor Core -->
  <path d="M 200 180 L 200 260 C 200 295 225 320 256 320 C 287 320 312 295 312 260 L 312 180 L 284 180 L 284 256 C 284 274 272 290 256 290 C 240 290 228 274 228 256 L 228 180 Z" fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Center Core Star / Diamond -->
  <polygon points="256,220 268,240 256,260 244,240" fill="#ffffff" opacity="0.95" />

  <!-- Tech Dots -->
  <circle cx="256" cy="74" r="3" fill="#00d2ff" opacity="0.8" />
  <circle cx="256" cy="438" r="3" fill="#ff1744" opacity="0.8" />
  <circle cx="74" cy="256" r="3" fill="#ff1744" opacity="0.8" />
  <circle cx="438" cy="256" r="3" fill="#00d2ff" opacity="0.8" />
</svg>